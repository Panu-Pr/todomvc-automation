[pytest]
testpaths = tests
pythonpath = .
base_url = https://demo.playwright.dev/todomvc/
addopts =
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
    --html reports/report.html
    --self-contained-html
markers =
    high: core function; if broken, the app is unusable (smoke set: pytest -m high)
    med: works but wrong in some cases
    low: convenience or display
